services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATA_DIR=/srv/data
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5174:80"
    restart: unless-stopped
